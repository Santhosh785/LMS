# Growth Scholar — nginx reverse proxy
#
# Install as /etc/nginx/sites-available/growthscholar.in, symlink into
# sites-enabled, then:
#
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d growthscholar.in -d www.growthscholar.in
#
# certbot rewrites this file in place to add the TLS block and the 80→443
# redirect, and installs a renewal timer. Re-running certbot after editing this
# file is safe; editing it after certbot has run means re-checking that its
# additions survived.
#
# Node serves both the API and the built SPA on 127.0.0.1:5000 — a single origin,
# so the auth cookie stays same-site and there is no CORS to configure here.

server {
    listen 80;
    listen [::]:80;
    server_name growthscholar.in www.growthscholar.in;

    # Certbot's HTTP-01 challenge, before anything else can intercept it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name growthscholar.in www.growthscholar.in;

    # --- TLS (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/growthscholar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/growthscholar.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS. Deliberately without `preload`: submitting to the preload list is
    # effectively irreversible, and this domain is one week old.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers otherwise come from helmet in the Node process, so they
    # are defined once. Do not duplicate the CSP here — two policies intersect,
    # and the failure looks like "the Bunny player randomly stopped working".

    # The UPI QR is an inline SVG data URI and course pages carry long
    # descriptions; the API accepts 2MB bodies for the curriculum editor.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # X-Forwarded-For is what express-rate-limit keys on via req.ip. It only
        # means anything because the app sets `trust proxy` to exactly 1 — the
        # single hop this file represents. See env.trustProxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Long-lived cache for Vite's fingerprinted assets. index.html is served
    # no-cache by Express so a deploy is picked up immediately.
    location /assets/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check for the uptime monitor (task 19). Kept out of the access log
    # so a one-minute probe does not bury real traffic.
    location = /api/health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        access_log off;
    }
}
