name: Deploy to Coolify

# Any push to main — from you or a collaborator — redeploys the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push supersedes an in-flight run rather than
# racing it, so the server always ends on the newest commit.
concurrency:
  group: coolify-deploy
  cancel-in-progress: false

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      # Workspace install: the root lockfile covers client and server.
      - run: npm ci

      - name: Build client
        run: npm run build

  deploy:
    name: Trigger Coolify deploy
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy API
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          # Optional. Left unset, the app is resolved by matching this
          # repository against each Coolify application's git_repository.
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail

          for v in COOLIFY_URL COOLIFY_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret $v"
              exit 1
            fi
          done

          # Strip any trailing slash so the URL joins cleanly.
          base="${COOLIFY_URL%/}"

          api() {
            curl -sS --max-time 60 \
              -o "$2" -w '%{http_code}' \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H 'Accept: application/json' \
              "$base$1"
          }

          uuid="$COOLIFY_APP_UUID"

          if [ -z "$uuid" ]; then
            echo "Resolving the Coolify application for $GITHUB_REPOSITORY"

            code=$(api /api/v1/applications apps.json)
            if [ "$code" != "200" ]; then
              echo "::error::Could not list Coolify applications (HTTP $code)."
              echo "::error::Check that COOLIFY_URL is reachable from GitHub and COOLIFY_TOKEN is valid."
              exit 1
            fi

            # Match on the repo slug so either an https or ssh remote resolves.
            uuid=$(jq -r --arg slug "$GITHUB_REPOSITORY" '
              [ .[]
                | select((.git_repository // "") | ascii_downcase | contains($slug | ascii_downcase))
              ] | first | .uuid // empty
            ' apps.json)

            if [ -z "$uuid" ]; then
              echo "::error::No Coolify application is wired to $GITHUB_REPOSITORY."
              echo "::error::Point the app's source at this repo, or set the COOLIFY_APP_UUID secret."
              echo "Applications visible to this token:"
              jq -r '.[] | "  - \(.name)  <- \(.git_repository // "no repo"):\(.git_branch // "?")"' apps.json
              exit 1
            fi

            name=$(jq -r --arg u "$uuid" '.[] | select(.uuid == $u) | .name' apps.json)
            echo "Matched application: $name"
          fi

          # The UUID is a deploy handle: keep it out of this public repo's logs.
          echo "::add-mask::$uuid"

          echo "Deploying $GITHUB_SHA"
          code=$(api "/api/v1/deploy?uuid=$uuid&force=false" deploy.json)

          echo "HTTP $code"
          jq . deploy.json 2>/dev/null || cat deploy.json
          echo

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Coolify rejected the deploy (HTTP $code)"
            exit 1
          fi

          echo "Deploy queued in Coolify."
